<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Casa">
<meta name="theme-color" content="#C4622D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Casa Criscuolo / Falabella</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#EDD5B0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif}
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  @keyframes calPop{from{opacity:0;transform:translateY(-5px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

  .app{
    max-width:480px;
    margin:0 auto;
    height:100%;
    display:flex;
    flex-direction:column;
    background:#FAF3E8;
  }

  .header{
    padding:env(safe-area-inset-top,14px) 20px 12px;
    padding-top:calc(env(safe-area-inset-top,0px) + 14px);
    background:#FDF6EC;
    border-bottom:1.5px solid #EDD9C0;
    flex-shrink:0;
  }

  .tabs{
    display:flex;
    background:#EDD9C0;
    border-bottom:1.5px solid #D4A574;
    padding:0 4px;
    flex-shrink:0;
  }
  .tab{
    all:unset;
    flex:1;
    padding:10px 0 9px;
    text-align:center;
    font-size:10px;
    font-weight:700;
    color:#8B6040;
    background:transparent;
    cursor:pointer;
    display:block;
    border-radius:10px 10px 0 0;
    margin:4px 2px 0;
  }
  .tab.active{color:#FFFFFF;background:#C4622D}

  .body{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:14px 14px 80px;
  }

  .section{display:none}
  .section.active{display:block}

  .card{background:#FDF6EC;border-radius:16px;padding:14px;margin-bottom:14px;border:1.5px solid #D4A574}

  .label{font-size:10px;font-weight:700;color:#A07850;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}

  .inp{
    all:unset;
    display:block;
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid #D4A574;
    background:#FAF3E8;
    color:#3D2010;
    font-size:14px;
    font-weight:500;
    margin-bottom:10px;
    box-sizing:border-box;
    -webkit-appearance:none;
  }
  .inp::placeholder{color:#C4A070}

  .btn-primary{
    all:unset;
    display:block;
    width:100%;
    padding:13px;
    border-radius:12px;
    background:#C4622D;
    color:#FFFFFF;
    font-size:15px;
    font-weight:700;
    text-align:center;
    cursor:pointer;
    box-sizing:border-box;
  }

  .btn-secondary{
    all:unset;
    padding:8px 14px;
    border-radius:9px;
    background:#EDD9C0;
    color:#8B4513;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    display:inline-block;
    border:1.5px solid #D4A574;
  }

  .cat-grid{display:grid;gap:6px;margin-bottom:12px}
  .cat-btn{
    all:unset;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:8px 3px;
    border-radius:11px;
    background:#FAF3E8;
    border:2px solid #EDD9C0;
    cursor:pointer;
    box-sizing:border-box;
    color:#C4A070;
  }
  .cat-btn span{font-size:9px;font-weight:600;color:#8B6040;line-height:1.2;text-align:center}
  .cat-btn.active span{font-weight:800}

  .payer-row{display:flex;gap:8px;margin-bottom:12px}
  .payer-btn{
    all:unset;
    flex:1;
    padding:9px 4px;
    border-radius:10px;
    background:#FAF3E8;
    border:2px solid #BCAAA4;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    box-sizing:border-box;
  }
  .payer-btn .avatar{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:800;
  }
  .payer-btn span{font-size:9px;font-weight:600;color:#8B6040;text-align:center;line-height:1.2}

  .adj-row{display:flex;gap:6px;margin-bottom:12px}
  .adj-btn{
    all:unset;
    flex:1;
    height:36px;
    border-radius:9px;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .adj-minus{background:#EDD9C0;color:#8B4513;border:1.5px solid #D4A574}
  .adj-plus{background:#C4622D;color:#FFFFFF}

  .date-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .date-btn{
    all:unset;
    display:flex;
    align-items:center;
    gap:6px;
    padding:10px 11px;
    border-radius:10px;
    background:#FAF3E8;
    cursor:pointer;
    box-sizing:border-box;
  }
  .date-btn.main-date{border:1.5px solid #D4A574}
  .date-btn.sc-date{border:2px solid #C4622D;background:#FFF3CD}
  .date-btn span{font-size:11px;font-weight:600;color:#3D2010;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .cal-dropdown{
    background:#FAF3E8;
    border:1.5px solid #D4A574;
    border-radius:14px;
    padding:12px;
    margin-top:4px;
    animation:calPop .18s ease;
  }
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-nav{all:unset;width:28px;height:28px;border-radius:8px;background:#C4622D;color:#FFFFFF;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-day-name{text-align:center;font-size:10px;font-weight:700;color:#A07850;padding:2px 0}
  .cal-day{text-align:center;padding:5px 2px;border-radius:7px;font-size:12px;cursor:pointer;color:#3D2010}
  .cal-day.today{background:#EDD9C0;color:#C4622D;font-weight:700}
  .cal-day.selected{background:#C4622D;color:#FFFFFF;font-weight:700}

  .divider{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .divider-line{flex:1;height:1px;background:#D4A574}
  .divider-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}

  .exp-card{background:#FDF6EC;border-radius:14px;padding:12px 13px;border:1.5px solid #EDD9C0;margin-bottom:8px;animation:fadeIn .2s ease}
  .exp-card.urgente{background:#FFE0D0;border-color:#C4622D;border-width:2px}
  .exp-card.scaduta{background:#FFCFBA;border-color:#B03000;border-width:2px}
  .exp-header{display:flex;align-items:center;gap:9px}
  .exp-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .exp-info{flex:1;min-width:0}
  .exp-name{font-size:13px;font-weight:700;color:#3D2010;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .exp-meta{font-size:10px;color:#A07850;font-weight:500;margin-top:1px}
  .exp-amt{font-size:14px;font-weight:800;color:#3D2010;font-family:Georgia,serif;flex-shrink:0}
  .exp-actions{display:flex;gap:6px;margin-top:9px}
  .btn-pagata{all:unset;flex:1;padding:7px 0;border-radius:9px;background:#C4622D;color:#FFFFFF;font-size:11px;font-weight:700;text-align:center;cursor:pointer;display:block}
  .btn-annulla{all:unset;flex:1;padding:7px 0;border-radius:9px;background:#EDD9C0;color:#8B4513;font-size:11px;font-weight:700;text-align:center;cursor:pointer;display:block}
  .btn-del{all:unset;padding:7px 12px;border-radius:9px;background:#EDD9C0;color:#8B4513;font-size:11px;font-weight:700;cursor:pointer;display:inline-block}
  .urg-badge{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:3px 10px;border-radius:20px}
  .urg-text{font-size:10px;font-weight:700}

  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .sum-card{border-radius:14px;padding:12px 14px}
  .sum-card.da{background:#FFF3CD;border:1.5px solid #F0C060}
  .sum-card.ok{background:#E8F0E0;border:1.5px solid #A8C080}
  .sum-label{font-size:10px;font-weight:800;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
  .sum-card.da .sum-label{color:#8B4513}
  .sum-card.ok .sum-label{color:#3A5A1A}
  .sum-val{font-size:22px;font-weight:800;font-family:Georgia,serif}
  .sum-card.da .sum-val{color:#8B4513}
  .sum-card.ok .sum-val{color:#3A5A1A}

  .wish-card{border-radius:16px;overflow:hidden;border:1.5px solid #EDD9C0;margin-bottom:10px}
  .wish-card.bought{border-color:#A0C060;background:#EEF4E4}
  .wish-img-ph{width:100%;height:56px;display:flex;align-items:center;justify-content:center}
  .wish-body{padding:10px 13px 12px}
  .wish-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
  .wish-name{font-size:14px;font-weight:700;font-family:Georgia,serif}
  .wish-cat-badge{font-size:10px;padding:3px 9px;border-radius:20px;flex-shrink:0;font-weight:700;border-width:1px;border-style:solid}
  .wish-actions{display:flex;gap:7px;margin-top:8px}
  .btn-remove{all:unset;background:#C4622D;color:#FFFFFF;border-radius:9px;padding:7px 13px;font-size:12px;cursor:pointer;font-weight:700;display:inline-block}
  .btn-bought{all:unset;border-radius:9px;padding:7px 13px;font-size:12px;cursor:pointer;font-weight:700;display:inline-block}

  .misura-card{background:#FDF6EC;border-radius:16px;overflow:hidden;border:1.5px solid #EDD9C0;margin-bottom:10px}
  .mis-ph{width:100%;height:52px;background:#EDD9C0;display:flex;align-items:center;justify-content:center}
  .mis-body{padding:10px 13px 12px}
  .mis-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px}
  .mis-name{font-size:14px;font-weight:700;color:#3D2010;font-family:Georgia,serif}
  .mis-badge{display:inline-flex;align-items:center;gap:6px;background:#EDD9C0;border:1.5px solid #D4A574;border-radius:9px;padding:5px 12px;margin-bottom:5px}
  .mis-note{font-size:12px;color:#8B6040;font-weight:500}
  .btn-del-sm{all:unset;background:#EDD9C0;border-radius:7px;padding:4px 9px;font-size:11px;color:#8B4513;cursor:pointer;font-weight:700;display:inline-block;flex-shrink:0}

  .empty{text-align:center;padding:24px 0;font-size:13px;color:#A07850;font-weight:500}

  .notepad{
    display:block;
    width:100%;
    min-height:calc(100vh - 200px);
    padding:18px 20px;
    font-family:Georgia,'Times New Roman',serif;
    font-size:15px;
    line-height:1.9;
    color:#3D2010;
    background:#FAF3E8;
    border:none;
    outline:none;
    resize:none;
    -webkit-appearance:none;
  }
  .notepad::placeholder{color:#C4A070;font-style:italic}

  .onboarding{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    padding:40px 28px;
    background:#FAF3E8;
  }
  .on-title{font-size:24px;font-weight:700;color:#3D2010;font-family:Georgia,serif;text-align:center;line-height:1.3}
  .on-sub{font-size:14px;color:#8B6040;font-weight:500;text-align:center;margin-top:6px}
  .on-label{font-size:11px;font-weight:700;color:#C4622D;margin-bottom:5px;text-transform:uppercase;letter-spacing:.8px}
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ONBOARDING -->
  <div class="onboarding" id="onboarding" style="display:none">
    <div style="width:64px;height:64px;border-radius:18px;background:#C4622D;display:flex;align-items:center;justify-content:center">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    </div>
    <div>
      <div class="on-title">Casa Criscuolo<br><span style="color:#C4622D">/ Falabella</span></div>
      <div class="on-sub">Inserite i vostri nomi per iniziare</div>
    </div>
    <div style="width:100%;display:flex;flex-direction:column;gap:10px">
      <div>
        <div class="on-label">Persona 1</div>
        <input id="name1" class="inp" placeholder="Es. Alfonso" style="margin-bottom:0">
      </div>
      <div>
        <div class="on-label">Persona 2</div>
        <input id="name2" class="inp" placeholder="Es. Alina" style="margin-bottom:0">
      </div>
    </div>
    <button class="btn-primary" onclick="completeOnboarding()">Iniziamo →</button>
  </div>

  <!-- MAIN -->
  <div id="main" style="display:none;flex:1;flex-direction:column;overflow:hidden">
    <div class="header">
      <div style="font-size:17px;font-weight:700;color:#3D2010;font-family:Georgia,serif;line-height:1.2">Casa Criscuolo</div>
      <div style="font-size:12px;font-weight:600;color:#C4622D;font-family:Georgia,serif;font-style:italic;line-height:1.2">/ Falabella</div>
    </div>

    <div class="tabs">
      <button id="tab-spese" class="tab active" onclick="switchTab('spese')">Spese</button>
      <button id="tab-acquisto" class="tab" onclick="switchTab('acquisto')">Da acquistare</button>
      <button id="tab-casa" class="tab" onclick="switchTab('casa')">Casa</button>
      <button id="tab-misure" class="tab" onclick="switchTab('misure')">Misure</button>
    </div>

    <div class="body">

      <!-- SPESE -->
      <div id="sec-spese" class="section active">
        <div class="summary-grid" id="summaryBar"></div>

        <div class="card">
          <input id="expName" class="inp" placeholder="Nome spesa (opzionale)">
          <div class="label">Categoria</div>
          <div class="cat-grid" style="grid-template-columns:repeat(4,1fr)" id="catRow1"></div>
          <div class="cat-grid" style="grid-template-columns:repeat(4,1fr)" id="catRow2"></div>
          <div class="label">Importo</div>
          <div style="position:relative;margin-bottom:8px">
            <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;font-weight:800;color:#C4622D;pointer-events:none;z-index:1">€</span>
            <input id="expAmt" type="number" class="inp" placeholder="0.00" min="0" step="1" style="padding-left:28px;margin-bottom:0">
          </div>
          <div class="adj-row">
            <button class="adj-btn adj-minus" onclick="changeAmt(-10)">−10</button>
            <button class="adj-btn adj-minus" onclick="changeAmt(-1)">−1</button>
            <button class="adj-btn adj-plus" onclick="changeAmt(1)">+1</button>
            <button class="adj-btn adj-plus" onclick="changeAmt(10)">+10</button>
          </div>
          <div class="label">Chi paga?</div>
          <div class="payer-row" id="payerBtns"></div>
          <div class="label" id="dateRowLabel">Data</div>
          <div class="date-row" id="dateRow">
            <div id="calMainWrap">
              <button class="date-btn main-date" onclick="toggleCal('main')" style="width:100%">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#C4622D" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                <span id="dateLabel"></span>
              </button>
              <div id="calMain" style="display:none" class="cal-dropdown"></div>
            </div>
            <div id="calScWrap">
              <button class="date-btn sc-date" onclick="toggleCal('sc')" style="width:100%">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#C4622D" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="12" cy="15" r="1.5" fill="#C4622D"/></svg>
                <span id="dateLabelSc" style="color:#8B4513"></span>
              </button>
              <div id="calSc" style="display:none" class="cal-dropdown">
                <div id="calScInner"></div>
                <button onclick="clearSc()" style="all:unset;display:block;width:100%;margin-top:8px;padding:7px 0;border-radius:8px;background:#EDD9C0;color:#8B4513;font-size:11px;font-weight:700;text-align:center;cursor:pointer;box-sizing:border-box;border:1.5px solid #D4A574">Rimuovi scadenza</button>
              </div>
            </div>
          </div>
          <button class="btn-primary" onclick="addExpense()">+ Aggiungi spesa</button>
        </div>

        <div class="divider"><div class="divider-line"></div><span class="divider-label" style="color:#C4622D">Da pagare</span><div class="divider-line"></div></div>
        <div id="listDaPagare"></div>
        <div class="divider" style="margin-top:8px"><div class="divider-line"></div><span class="divider-label" style="color:#6A8A4A">Pagate</span><div class="divider-line"></div></div>
        <div id="listPagate"></div>
      </div>

      <!-- DA ACQUISTARE -->
      <div id="sec-acquisto" class="section">
        <div style="background:#FDF6EC;border-radius:16px;border:1.5px solid #D4A574;overflow:hidden">
          <div style="padding:13px 16px 11px;border-bottom:1.5px solid #EDD9C0;display:flex;align-items:center;gap:8px;background:#FDF6EC">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C4622D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span style="font-size:14px;font-weight:700;color:#3D2010;font-family:Georgia,serif;flex:1">Note libere</span>
          </div>
          <textarea id="notepad" class="notepad" placeholder="Scrivi qui..."></textarea>
        </div>
      </div>

      <!-- CASA -->
      <div id="sec-casa" class="section">
        <div class="card">
          <input id="wishName" class="inp" placeholder="Nome oggetto (opzionale)">
          <div class="label">Categoria</div>
          <div class="cat-grid" style="grid-template-columns:repeat(3,1fr)" id="casaCatRow1"></div>
          <div class="cat-grid" style="grid-template-columns:repeat(3,1fr)" id="casaCatRow2"></div>
          <input id="wishDims" class="inp" placeholder="Misure (es. 40×60 cm)">
          <input id="wishLink" class="inp" placeholder="Link prodotto (Amazon, IKEA...)">
          <input id="wishBudget" type="number" class="inp" placeholder="Budget indicativo (€)">
          <button onclick="document.getElementById('wishPhotoInput').click()" style="all:unset;display:block;width:100%;height:50px;border:2px dashed #D4A574;border-radius:10px;background:#FAF3E8;color:#C4622D;font-size:13px;font-weight:700;text-align:center;cursor:pointer;box-sizing:border-box;line-height:50px;margin-bottom:8px">+ Aggiungi foto</button>
          <input type="file" id="wishPhotoInput" accept="image/*" style="display:none" onchange="handlePhoto('wish',this)">
          <img id="wishPreview" style="display:none;width:100%;height:80px;object-fit:cover;border-radius:10px;margin-bottom:8px">
          <button class="btn-primary" onclick="addWish()">+ Aggiungi oggetto</button>
        </div>
        <div id="wishList"></div>
      </div>

      <!-- MISURE -->
      <div id="sec-misure" class="section">
        <div class="card">
          <input id="misuraName" class="inp" placeholder="Nome luogo (es. Nicchia soggiorno...)">
          <input id="misuraDims" class="inp" placeholder="Misure (es. L 80 × H 120 × P 30 cm)">
          <input id="misuraNote" class="inp" placeholder="Note">
          <button onclick="document.getElementById('misuraPhotoInput').click()" style="all:unset;display:block;width:100%;height:50px;border:2px dashed #D4A574;border-radius:10px;background:#FAF3E8;color:#C4622D;font-size:13px;font-weight:700;text-align:center;cursor:pointer;box-sizing:border-box;line-height:50px;margin-bottom:8px">+ Aggiungi foto</button>
          <input type="file" id="misuraPhotoInput" accept="image/*" style="display:none" onchange="handlePhoto('misura',this)">
          <img id="misuraPreview" style="display:none;width:100%;height:80px;object-fit:cover;border-radius:10px;margin-bottom:8px">
          <button class="btn-primary" onclick="addMisura()">+ Salva misura</button>
        </div>
        <div id="misuraList"></div>
      </div>

    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, push, remove, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyCHPWXCOg3lwu6_okAlpUomiGWoJ7f9he8",
  authDomain: "casa-criscuolo.firebaseapp.com",
  databaseURL: "https://casa-criscuolo-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "casa-criscuolo",
  storageBucket: "casa-criscuolo.firebasestorage.app",
  messagingSenderId: "229191200590",
  appId: "1:229191200590:web:3eacdaa52d32780a40381f"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const ROOT = 'casa_criscuolo';

// Rimuovi null/undefined prima di salvare su Firebase
function clean(obj) {
  const out = {};
  for (const [k, v] of Object.entries(obj)) {
    if (v !== null && v !== undefined && k !== '_k') {
      out[k] = v;
    }
  }
  return out;
}

// Firebase object → array ordinato per ts decrescente
function snap2arr(obj) {
  if (!obj) return [];
  return Object.entries(obj)
    .map(([k, v]) => ({ ...v, _k: k }))
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));
}

// Aggiungi nuovo item (push = chiave univoca)
function fbAdd(type, item) {
  const data = clean(item);
  data.ts = Date.now();
  push(ref(db, ROOT + '/' + type), data)
    .catch(e => console.error('fbAdd error:', e));
}

// Aggiorna item esistente tramite _k
function fbUpd(type, item) {
  if (!item._k) { console.warn('fbUpd: missing _k'); return; }
  const data = clean(item);
  set(ref(db, ROOT + '/' + type + '/' + item._k), data)
    .catch(e => console.error('fbUpd error:', e));
}

// Elimina item tramite _k
function fbDel(type, item) {
  if (!item._k) { console.warn('fbDel: missing _k'); return; }
  remove(ref(db, ROOT + '/' + type + '/' + item._k))
    .catch(e => console.error('fbDel error:', e));
}

// Ascolta in tempo reale
function fbOn(type, cb) {
  onValue(ref(db, ROOT + '/' + type), snap => cb(snap.val()));
}

window._fb = { add: fbAdd, upd: fbUpd, del: fbDel, on: fbOn, arr: snap2arr, ready: true };
console.log('Firebase ready');
</script>

function pad(n){return String(n).padStart(2,'0')}
function dateToStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function strToDisplay(s){if(!s)return '';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function today(){return dateToStr(new Date())}
function daysUntil(s){if(!s)return null;return Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/(864e5))}

function load(){
  // Names and note are local-only
  try{const n=localStorage.getItem('cc_n');if(n)names=JSON.parse(n);}catch(e){}
  try{const note=localStorage.getItem('cc_note')||'';setTimeout(()=>{const t=document.getElementById('notepad');if(t)t.value=note;},200);}catch(e){}

  // Wait for Firebase module to be ready then start listeners
  function waitFb(attempt){
    if(window._fb && window._fb.ready){
      startFbListeners();
    } else if(attempt < 30){
      setTimeout(()=>waitFb(attempt+1), 100);
    } else {
      // Offline fallback
      try{
        exp=JSON.parse(localStorage.getItem('cc_e')||'[]');
        wish=JSON.parse(localStorage.getItem('cc_w')||'[]');
        misure=JSON.parse(localStorage.getItem('cc_m')||'[]');
        renderExp();renderWish();renderMisure();renderSummary();
      }catch(e){}
    }
  }

  function startFbListeners(){
    // SPESE — usa snap2arr per mantenere _k key di ogni item
    window._fb.on('exp', data => {
      exp = window._fb.arr(data);
      try{localStorage.setItem('cc_e',JSON.stringify(exp));}catch(e){}
      if(document.getElementById('listDa')){renderExp();renderSummary();}
    });

    // CASA
    window._fb.on('wish', data => {
      wish = window._fb.arr(data);
      try{localStorage.setItem('cc_w',JSON.stringify(wish));}catch(e){}
      if(document.getElementById('wishList'))renderWish();
    });

    // MISURE
    window._fb.on('mis', data => {
      misure = window._fb.arr(data);
      try{localStorage.setItem('cc_m',JSON.stringify(misure));}catch(e){}
      if(document.getElementById('misuraList'))renderMisure();
    });
  }

  waitFb(0);
}
function save(){
  // save() is now a no-op for exp/wish/mis:
  // each add/update/delete calls Firebase directly via addExp/toggleExp/delExp etc.
  // localStorage kept as offline cache only
  try{
    localStorage.setItem('cc_e',JSON.stringify(exp));
    localStorage.setItem('cc_w',JSON.stringify(wish));
    localStorage.setItem('cc_m',JSON.stringify(misure));
  }catch(e){}
}

  } else {

  }
  const ta=document.getElementById('notepad');

    }).join('');

function renderCal(which){
  const state=which==='main'?calMain:calSc;
  const y=state.nav.getFullYear(),m=state.nav.getMonth();
  const selStr=state.sel?dateToStr(state.sel):'',tod=today();
  const navHtml=(dir)=>`<button class="cal-nav" onclick="calNav('${which}',${dir})">${dir<0?'‹':'›'}</button>`;
  const days=new Date(y,m+1,0).getDate();
  const offset=(new Date(y,m,1).getDay()+6)%7;
  let daysHtml='';
  DAYS.forEach(d=>{daysHtml+=`<div class="cal-day-name">${d}</div>`;});
  for(let i=0;i<offset;i++)daysHtml+=`<div></div>`;
  for(let d=1;d<=days;d++){
    const ds=y+'-'+pad(m+1)+'-'+pad(d);
    const cls=ds===selStr?'cal-day selected':ds===tod?'cal-day today':'cal-day';
    daysHtml+=`<div class="${cls}" onclick="selectDate('${which}','${ds}')">${d}</div>`;
  }
  return`<div class="cal-header">${navHtml(-1)}<span style="font-size:12px;font-weight:700;color:#3D2010">${MONTHS[m]} ${y}</span>${navHtml(1)}</div><div class="cal-grid">${daysHtml}</div>`;
}

function toggleCal(which){

    scEl.style.display=open?'block':'none';
    mainEl.style.display='none';
    if(open){
      document.getElementById('calScInner').innerHTML=renderCal('sc');
    }
  }
}

function calNav(which,dir){
  event.stopPropagation();

  state.nav=new Date(state.nav.getFullYear(),state.nav.getMonth()+dir,1);
  if(which==='main')document.getElementById('calMain').innerHTML=renderCal('main');
  else document.getElementById('calScInner').innerHTML=renderCal('sc');

function renderSummary(){
  const da=exp.filter(e=>e.s==='da').reduce((s,e)=>s+e.a,0);
  const ok=exp.filter(e=>e.s==='ok').reduce((s,e)=>s+e.a,0);
  document.getElementById('summaryBar').innerHTML=`
    <div class="sum-card da"><div class="sum-label">Da pagare</div><div class="sum-val">€ ${da.toFixed(2)}</div></div>
    <div class="sum-card ok"><div class="sum-label">Pagate</div><div class="sum-val">€ ${ok.toFixed(2)}</div></div>`;

function urgBadge(sc){
  const d=daysUntil(sc);if(d===null)return'';
  let text,color,bg;
  if(d<0){text=`Scaduta da ${Math.abs(d)}g`;color='#C4622D';bg='#FFE0D0';}
  else if(d===0){text='Scade oggi!';color='#C4622D';bg='#FFE0D0';}
  else if(d<=5){text=`Scade tra ${d}g`;color='#C4622D';bg='#FFE0D0';}
  else if(d<=10){text=`Scade tra ${d}g`;color='#A05010';bg='#FFF3CD';}
  else{text=`Scade il ${strToDisplay(sc)}`;color='#6B7280';bg='#F3F4F6';}
  return`<div class="urg-badge" style="background:${bg}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span class="urg-text" style="color:${color}">${text}</span></div>`;
}

function expCardHTML(e,isDa){
  const cat=CATS.find(c=>c.id===e.c)||CATS[7];
  const pl=e.payer==='A metà'?`A metà · €${e.half} a testa`:e.payer;
  let urgClass='';
  if(isDa&&e.sc){const d=daysUntil(e.sc);if(d<0)urgClass='scaduta';else if(d<=5)urgClass='urgente';}
  return`<div class="exp-card ${urgClass}">
    <div class="exp-header">
      <div class="exp-icon" style="background:${cat.bg};color:${cat.color}">${cat.svg}</div>
      <div class="exp-info"><div class="exp-name">${e.n}</div><div class="exp-meta">${[pl,e.dt?strToDisplay(e.dt):''].filter(Boolean).join(' · ')}</div></div>
      <div class="exp-amt">€${e.a.toFixed(2)}</div>
    </div>
    ${isDa&&e.sc?urgBadge(e.sc):''}
    ${!isDa&&e.sc?`<div style="font-size:10px;color:#A07850;margin-top:5px">Scadenza: ${strToDisplay(e.sc)}</div>`:''}
    <div class="exp-actions">
      <button class="${isDa?'btn-pagata':'btn-annulla'}" onclick="toggleExp('${e._k||e.id}')">${isDa?'Segna come pagata':'Annulla pagamento'}</button>
      <button class="btn-del" onclick="delExp('${e._k||e.id}')">✕</button>
    </div>
  </div>`;
}

function renderExp(){
  const da=exp.filter(e=>e.s==='da').sort((a,b)=>(a.sc||'9999')>(b.sc||'9999')?1:-1);
  const ok=exp.filter(e=>e.s==='ok').sort((a,b)=>(b.paidAt||b.dt||'')>(a.paidAt||a.dt||'')?1:-1);
  document.getElementById('listDaPagare').innerHTML=da.length?da.map(e=>expCardHTML(e,true)).join(''):'<div class="empty">Nessuna spesa da pagare</div>';
  document.getElementById('listPagate').innerHTML=ok.length?ok.map(e=>expCardHTML(e,false)).join(''):'<div class="empty">Nessuna spesa pagata</div>';
}

function addExpense(){
  const a=parseFloat(document.getElementById('expAmt').value);
  if(isNaN(a)||a<=0)return;
  const n=document.getElementById('expName').value.trim();
  const cat=CATS.find(c=>c.id===selCat)||CATS[7];
  const half=selPayer==='A metà'?+(a/2).toFixed(2):null;
  const BOLLETTE_IDS=['luce','acqua','gas'];
  const isBol=BOLLETTE_IDS.includes(selCat);
  const dtSave=isBol?null:dateToStr(calMain.sel||new Date());
  const scSave=calSc.sel?dateToStr(calSc.sel):null;
  const newItem = {n:n||cat.label,a,c:selCat,dt:dtSave,sc:scSave,payer:selPayer,half,s:'da',ts:Date.now()};
  // Write directly to Firebase — listener will update local array and re-render
  if(window._fb && window._fb.ready){
    window._fb.add('exp', newItem);
  } else {
    exp.unshift({...newItem, id:Date.now()});
    save();renderExp();renderSummary();
  }
  document.getElementById('expName').value='';document.getElementById('expAmt').value='';
  selPayer='';selCat='altro';calMain.sel=new Date();calSc.sel=null;
  const mw=document.getElementById('calMainWrap');if(mw)mw.style.display='block';
  const sw2=document.getElementById('calScWrap');if(sw2)sw2.style.display='none';
  const lbl=document.getElementById('dateRowLabel');if(lbl)lbl.textContent='Data';
  document.getElementById('dateLabel').textContent=strToDisplay(today());
  document.getElementById('dateLabelSc').textContent='Scadenza';
  // default: show Data, hide Scadenza
  const scWrapInit=document.getElementById('calScWrap');
  if(scWrapInit)scWrapInit.style.display='none';
  renderCatIcons();renderPayerBtns();
}
function toggleExp(id){
  const e=exp.find(x=>x._k===id||String(x.id)===String(id)||String(x.ts)===String(id));
  if(!e){console.warn('toggleExp: not found',id);return;}
  e.s=e.s==='da'?'ok':'da';
  if(e.s==='ok')e.paidAt=today();
  if(e._k){
    window._fb.upd('exp',e);
  } else {
    // vecchio dato senza push key: elimina e reinserisci
    window._fb.add('exp', {...e, s:e.s, paidAt:e.paidAt||null});
  }
}
function delExp(id){
  const e=exp.find(x=>x._k===id||String(x.id)===String(id)||String(x.ts)===String(id));
  if(!e){console.warn('delExp: not found',id);return;}
  if(e._k){
    window._fb.del('exp',e);
  } else {
    // vecchio dato con chiave numerica — rimuovi dall'array locale e aggiorna tutto
    exp=exp.filter(x=>x!==e);
    if(window._fb&&window._fb.ready){
      // riscrivi tutto exp su Firebase con le push key corrette
      exp.forEach(item=>window._fb.add('exp',item));
    }
    renderExp();renderSummary();
  }
}

function handlePhoto(type,input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{photos[type]=e.target.result;const p=document.getElementById(type+'Preview');p.src=photos[type];p.style.display='block';};r.readAsDataURL(f);}

function addWish(){
  const cat=CASA_CATS.find(c=>c.id===selCasaCat)||CASA_CATS[5];
  const n=document.getElementById('wishName').value.trim()||cat.label;
  const d=document.getElementById('wishDims').value.trim();
  const l=document.getElementById('wishLink').value.trim();
  const bgt=parseFloat(document.getElementById('wishBudget').value)||null;
  const newWish={n,c:selCasaCat,d,l,bgt,p:photos.wish,b:false,ts:Date.now()};
  if(window._fb && window._fb.ready){
    window._fb.add('wish', newWish);
  } else {
    wish.unshift({...newWish,id:Date.now()});
    save();renderWish();
  }
  ['wishName','wishDims','wishLink','wishBudget'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('wishPreview').style.display='none';document.getElementById('wishPhotoInput').value='';photos.wish=null;
  selCasaCat='Lampada';renderCasaCatIcons();
}
function toggleWish(id){
  const w=wish.find(x=>x._k===id||String(x.id)===String(id)||String(x.ts)===String(id));
  if(!w)return;
  w.b=!w.b;
  if(w._k){window._fb.upd('wish',w);}
}
function delWish(id){
  const w=wish.find(x=>x._k===id||String(x.id)===String(id)||String(x.ts)===String(id));
  if(!w)return;
  if(w._k){window._fb.del('wish',w);}
}
function renderWish(){
  const el=document.getElementById('wishList');
  if(!wish.length){el.innerHTML='<div class="empty">Nessun oggetto salvato</div>';return;}
  el.innerHTML=wish.map(w=>{
    const cat=CASA_CATS.find(c=>c.id===w.c)||CASA_CATS[5];
    return`<div class="wish-card${w.b?' bought':''}">
      ${w.p?`<img src="${w.p}" style="width:100%;height:110px;object-fit:cover;display:block">`:`<div class="wish-img-ph" style="background:${cat.bg};color:${cat.color}">${cat.svg.replace(/width="18" height="18"/g,'width="26" height="26"')}</div>`}
      <div class="wish-body">
        ${w.b?'<span style="font-size:11px;color:#FFF;font-weight:700;background:#6A8A4A;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:6px">✓ Comprato</span>':''}
        <div class="wish-top">
          <span class="wish-name" style="color:${w.b?'#3A5A1A':'#3D2010'}">${w.n}</span>
          <span class="wish-cat-badge" style="background:${cat.bg};color:${cat.color};border-color:${cat.color}">${w.c}</span>
        </div>
        ${w.d?`<div style="font-size:12px;color:#A07850;font-weight:600;margin-bottom:4px">${w.d}</div>`:''}
        ${w.bgt?`<div style="font-size:12px;color:#7B1FA2;font-weight:700;margin-bottom:4px">Budget: €${w.bgt}</div>`:''}
        ${w.l?`<a href="${w.l}" target="_blank" style="font-size:12px;color:#C4622D;text-decoration:none;font-weight:700;display:inline-block;margin-bottom:6px">Apri link →</a>`:''}
        <div class="wish-actions">
          <button class="btn-remove" onclick="delWish('${w._k||w.id}')">Rimuovi</button>
          <button class="btn-bought" onclick="toggleWish('${w._k||w.id}')" style="background:${w.b?'#A07850':'#6A8A4A'};color:#FFF">${w.b?'Annulla':'Segna comprato'}</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function addMisura(){
  const n=document.getElementById('misuraName').value.trim();if(!n)return;
  const d=document.getElementById('misuraDims').value.trim();
  const note=document.getElementById('misuraNote').value.trim();
  const newMis={n,d,note,p:photos.misura,ts:Date.now()};
  if(window._fb && window._fb.ready){window._fb.add('mis',newMis);}
  else{misure.unshift({...newMis,id:Date.now()});save();renderMisure();}
  ['misuraName','misuraDims','misuraNote'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('misuraPreview').style.display='none';document.getElementById('misuraPhotoInput').value='';photos.misura=null;
}
function delMisura(id){
  const m=misure.find(x=>x._k===id||String(x.id)===String(id)||String(x.ts)===String(id));
  if(!m)return;
  if(m._k){window._fb.del('mis',m);}
}
function renderMisure(){
  const el=document.getElementById('misuraList');
  if(!misure.length){el.innerHTML='<div class="empty">Nessuna misura salvata</div>';return;}
  el.innerHTML=misure.map(m=>`
    <div class="misura-card">
      ${m.p?`<img src="${m.p}" style="width:100%;height:110px;object-fit:cover;display:block">`:`<div class="mis-ph"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A07850" stroke-width="1.5"><path d="M3 6h18M3 12h12M3 18h8"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg></div>`}
      <div class="mis-body">
        <div class="mis-top">
          <span class="mis-name">${m.n}</span>
          <button class="btn-del-sm" onclick="delMisura('${m._k||m.id}')">✕</button>
        </div>
        ${m.d?`<div class="mis-badge"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#C4622D" stroke-width="2.5"><path d="M4 20h16M4 4v16"/><path d="M8 16V8M12 16v-4M16 16V6"/></svg><span style="font-size:13px;font-weight:800;color:#C4622D">${m.d}</span></div>`:''}
        ${m.note?`<div class="mis-note">${m.note}</div>`:''}
      </div>
    </div>`).join('');
}

window.addEventListener('DOMContentLoaded', init);

</script>
